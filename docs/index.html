<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0b0d10">
<title>Cookies and Cream</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f2f2ef'/%3E%3Ccircle cx='11' cy='13' r='2.4' fill='%230b0d10'/%3E%3Ccircle cx='20' cy='19' r='2.4' fill='%230b0d10'/%3E%3Ccircle cx='19' cy='10' r='1.6' fill='%230b0d10'/%3E%3Ccircle cx='11' cy='22' r='1.6' fill='%230b0d10'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="gate">
  <form id="gateForm" class="gate-card" autocomplete="off">
    <div class="gate-title">Cookies and Cream</div>
    <div class="gate-sub">Alpha Theta. Passphrase to open.</div>
    <label for="gatePass" class="sr-only">Passphrase</label>
    <input id="gatePass" type="password" inputmode="text" placeholder="passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
    <button type="submit">Open</button>
    <div id="gateErr" class="gate-err"></div>
  </form>
</div>

<header class="top">
  <div class="brand">
    <span class="dot"></span>
    <span class="brand-name">Cookies and Cream</span>
  </div>
  <div class="top-right">
    <label for="me" class="sr-only">Who are you</label>
    <select id="me" title="Who are you" aria-label="Who are you"></select>
    <span id="sync" class="sync" title="Last sync">…</span>
  </div>
</header>

<div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-tab="now" class="on">Now</button>
  <button data-tab="board">Board</button>
  <button data-tab="rules">Rules</button>
  <button data-tab="actives">Actives</button>
  <button data-tab="cal">Calendar</button>
  <button data-tab="threads">Threads</button>
</nav>

<main id="view" tabindex="-1"></main>


<script src="app.js"></script>
</body>
</html>
